name: First run - SMA-150 check

# Runs only when you press "Run workflow" on the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sma-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Compute SMA-150
        run: python scripts/first_run.py
